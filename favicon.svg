<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Scooterland. A kick scooter on a 16x16 pixel grid, so it stays
       hard-edged at the size a browser tab actually draws it:

       ................
       ......XXXXXX....
       ......XXXXXX....
       .........XX.....
       ..........XX....
       ..........XX....
       ...........XX...
       ...........XX...
       ..XXXXXXXXXXX...
       ..XXXXXXXXXXX...
       ................
       ...XX......XX...
       ..X..X....X..X..
       ..X..X....X..X..
       ...XX......XX...
       ................

       Ink #16283c on #edc0ad, the site's two colours.
       Redraw it in outreach/build_favicon.py, not here. -->
  <rect width="16" height="16" rx="2" fill="#edc0ad"/>
  <g fill="#16283c">
    <rect x="6" y="1" width="6" height="2"/>
    <rect x="9" y="3" width="2" height="1"/>
    <rect x="10" y="4" width="2" height="2"/>
    <rect x="11" y="6" width="2" height="2"/>
    <rect x="2" y="8" width="11" height="2"/>
    <rect x="3" y="11" width="2" height="1"/>
    <rect x="11" y="11" width="2" height="1"/>
    <rect x="2" y="12" width="1" height="2"/>
    <rect x="5" y="12" width="1" height="2"/>
    <rect x="10" y="12" width="1" height="2"/>
    <rect x="13" y="12" width="1" height="2"/>
    <rect x="3" y="14" width="2" height="1"/>
    <rect x="11" y="14" width="2" height="1"/>
  </g>
</svg>
